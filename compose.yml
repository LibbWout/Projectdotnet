services:
  db:
    container_name: dbnet
    image: mariadb
    ports:
      - 3307:3306
    volumes:
        - ./db/config:/var/lib/mysql
        - ./db/init:/docker-entrypoint-initdb.d
    environment:
        - MARIADB_DATABASE=project
        - MARIADB_ROOT_PASSWORD=root
        - TZ=Europe/Brussels
    restart: unless-stopped
  dbadmin:
    container_name: dbmyadminnet
    image: phpmyadmin
    ports:
      - 81:80
    environment:
      - PMA_HOST=db
    depends_on:
      - db
    restart: unless-stopped
